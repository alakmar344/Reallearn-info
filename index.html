    <!-- Primary Meta -->

    <meta property="og:site_name" content="RealLearn AI" />

    <!-- Fonts: preconnect + non-blocking load with graceful fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Structured Data: WebSite + SoftwareApplication + FAQ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://reallearn.site/#website",
            "url": "https://reallearn.site/",
            "name": "RealLearn AI",
            "description": "AI learning platform that turns any question into a structured 3-stage, quiz-verified lesson.",
            "inLanguage": "en",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://reallearn.site/?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://reallearn.site/#app",
            "name": "RealLearn AI",
            "applicationCategory": "EducationalApplication",
            "operatingSystem": "Web, iOS, Android",
            "url": "https://reallearn.site/",
            "description": "Turn any confusing question into a crystal-clear 3-stage learning journey with active-recall quizzes, 63 global languages, and live real-world news.",
            "featureList": [
              "3-stage learning spine (Foundation, Mechanism, Real World)",
              "Active-recall checkpoint quizzes",
              "63 global languages",
              "Live real-world news grounding",
              "Gamified streaks, XP, and 56 achievement badges"
            ],
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            }
          },
          {
            "@type": "FAQPage",
            "@id": "https://reallearn.site/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Is RealLearn AI free to use?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes! RealLearn AI is completely free to use and 100% ad-free. Anyone with a curious mind can start exploring and learning immediately without paywalls or subscriptions."
                }
              },
              {
                "@type": "Question",
                "name": "How does the 3-step method help me understand faster?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "RealLearn breaks learning into three intuitive stages: first building simple intuition (The Foundation), then exploring the inner machinery (The Mechanism), and finally showing why it matters today (The Real World)."
                }
              },
              {
                "@type": "Question",
                "name": "Why are quizzes required to unlock the next part?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Cognitive science shows that active recall is up to 3x more effective than passive reading. By answering quick questions, you lock knowledge into long-term memory before moving forward."
                }
              },
              {
                "@type": "Question",
                "name": "Which languages are supported?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "RealLearn supports 63 global languages. Lessons are crafted directly in your chosen language with natural phrasing — never translated after the fact."
                }
              }
            ]
          }
        ]
      }
    </script>
  </head>
