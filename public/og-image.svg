<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="RealLearn AI — Stop searching for answers. Start truly understanding.">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE500"/>
      <stop offset="0.5" stop-color="#FF1B8D"/>
      <stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#000000"/>

  <!-- Hazard stripe corner -->
  <g>
    <rect x="0" y="0" width="1200" height="14" fill="#FF1B8D"/>
    <rect x="0" y="616" width="1200" height="14" fill="#00E5FF"/>
  </g>

  <!-- Drafting grid -->
  <g stroke="#7A3A6E" stroke-width="1" opacity="0.35">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Giant outline watermark -->
  <text x="1180" y="560" text-anchor="end" font-family="'Archivo','Segoe UI',system-ui,sans-serif" font-size="300" font-weight="900" letter-spacing="-8" fill="none" stroke="#7A3A6E" stroke-width="2" opacity="0.4">LEARN</text>

  <!-- Logo -->
  <g transform="translate(80,80)">
    <rect width="72" height="72" fill="url(#accent)" stroke="#FFFFFF" stroke-width="3"/>
    <text x="36" y="50" font-family="'Archivo','Segoe UI',system-ui,sans-serif" font-size="34" font-weight="900" text-anchor="middle" fill="#000000">RL</text>
    <text x="96" y="34" font-family="'Archivo','Segoe UI',system-ui,sans-serif" font-size="30" font-weight="900" fill="#FFFFFF">REALLEARN <tspan fill="#FF1B8D">AI</tspan></text>
    <text x="96" y="60" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="15" letter-spacing="2" fill="#00E5FF">THE WORLD IS YOUR TEXTBOOK</text>
  </g>

  <!-- Headline -->
  <text x="80" y="300" font-family="'Archivo','Segoe UI',system-ui,sans-serif" font-size="76" font-weight="900" fill="#FFFFFF">STOP SEARCHING FOR ANSWERS.</text>
  <text x="80" y="392" font-family="'Archivo','Segoe UI',system-ui,sans-serif" font-size="76" font-weight="900" fill="url(#accent)">START TRULY UNDERSTANDING.</text>

  <!-- Subhead -->
  <text x="80" y="456" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="26" fill="#E9CFE0">A structured 3-stage journey: Foundation → Mechanism → Real World.</text>

  <!-- Chips -->
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="18" font-weight="700">
    <g transform="translate(80,510)">
      <rect width="250" height="52" fill="#FF1B8D" stroke="#FFFFFF" stroke-width="2"/>
      <text x="125" y="34" text-anchor="middle" fill="#000000">ACTIVE-RECALL QUIZZES</text>
    </g>
    <g transform="translate(348,510)">
      <rect width="235" height="52" fill="#00E5FF" stroke="#FFFFFF" stroke-width="2"/>
      <text x="117" y="34" text-anchor="middle" fill="#000000">63 GLOBAL LANGUAGES</text>
    </g>
    <g transform="translate(601,510)">
      <rect width="220" height="52" fill="#FFE500" stroke="#FFFFFF" stroke-width="2"/>
      <text x="110" y="34" text-anchor="middle" fill="#000000">100% FREE &amp; AD-FREE</text>
    </g>
  </g>
</svg>
